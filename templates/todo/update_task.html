<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Task - ToDo App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4038b6, #0061d8, #007fe1, #0098d4, #00adb9, #00bf99);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            background: #ffffff;
            padding: 35px 35px;
            border-radius: 16px;
            box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.25);
            max-width: 620px;
            width: 100%;
            animation: fadeIn 0.6s ease-in-out;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f5;
        }

        h1 {
            color: #4038b6;
            font-size: 26px;
        }

        .btn-back {
            color: #007fe1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-back:hover {
            text-decoration: underline;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus {
            border-color: #00adb9;
            box-shadow: 0 0 6px rgba(0, 173, 185, 0.45);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .form-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #00adb9;
        }

        .checkbox-label {
            font-size: 14px;
            color: #444;
            cursor: pointer;
            user-select: none;
        }

        .submit-btn {
            padding: 13px;
            background: linear-gradient(90deg, #00adb9, #00bf99);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 4px 15px rgba(0, 173, 185, 0.35);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1>Update Task</h1>
            <a href="{% url 'list_task' %}" class="btn-back">&larr; Back to Task List</a>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.title.id_for_label }}">{{ form.title.label }}</label>
                {{ form.title }}
                {% if form.title.errors %}
                    <span style="color:#b91c1c; font-size:12px;">{{ form.title.errors.0 }}</span>
                {% endif %}
            </div>

            <div class="form-group">
                <label for="{{ form.description.id_for_label }}">{{ form.description.label }}</label>
                {{ form.description }}
                {% if form.description.errors %}
                    <span style="color:#b91c1c; font-size:12px;">{{ form.description.errors.0 }}</span>
                {% endif %}
            </div>

            <div class="checkbox-group">
                {{ form.complete }}
                <label for="{{ form.complete.id_for_label }}" class="checkbox-label">{{ form.complete.label }}</label>
            </div>

            <button type="submit" class="submit-btn">Update Task</button>
        </form>
    </div>
</body>
</html>
